name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    # Postgres for the @markup/server data-layer tests (the suite skips the
    # Postgres half when DATABASE_URL is unset, e.g. on local machines).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: markup
          POSTGRES_PASSWORD: markup
          POSTGRES_DB: markup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U markup"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # sync-core first so dependent workspaces resolve its dist/
      - name: Build sync-core
        run: npm run build --workspace @markup/sync-core

      - name: Build all workspaces
        run: npm run build

      - name: Test
        run: npm test
        env:
          DATABASE_URL: postgres://markup:markup@localhost:5432/markup_test

      - name: Type-check sync-core
        run: npx tsc -p packages/sync-core/tsconfig.json --noEmit

      - name: Type-check cli
        run: npx tsc -p packages/cli/tsconfig.json --noEmit

      - name: Type-check server
        run: npx tsc -p apps/server/tsconfig.json --noEmit

      - name: Type-check web
        run: npx tsc -p tsconfig.json --noEmit
        working-directory: apps/web
