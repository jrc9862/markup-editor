# WebSocket-aware load balancer for the multi-node Markup stack
# (docker-compose.scale.yml). Terminates client traffic on :4000 and spreads it
# across the `server` replicas. With Redis fan-out any node can serve any doc,
# so stickiness isn't required for correctness — but ip_hash keeps a given
# client's WS + REST on one node, which avoids needless awareness re-sync churn.

events {}

http {
  # Map the Upgrade header so non-WS requests don't get a dangling Connection.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream markup_backend {
    ip_hash;
    # Docker's embedded DNS resolves `server` to every replica at startup.
    # (`docker compose ... up --scale server=N` must bring the replicas up
    # before nginx — depends_on handles the ordering.)
    server server:4000;
  }

  server {
    listen 4000;

    location / {
      proxy_pass http://markup_backend;
      proxy_http_version 1.1;

      # WebSocket upgrade for the Yjs sync connections.
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # Real client identity for rate limiting (server sets trust proxy = 1).
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Long-lived WS + SSE streams must not be reaped as idle.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }
  }
}
